<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuditLens — IIA Congres 2026</title>
<style>
:root{--cream:#F4F0E6;--cream-soft:#ECE6D6;--paper:#FBF8F1;--ink:#1A1B2E;--ink-2:#2B2C40;--ink-soft:#555668;--slate:#8B8B95;--slate-soft:#D6D2C7;--line:#D9D4C5;--rust:#B83C2F;--rust-soft:#EBD5CF;--rust-deep:#8C2D24;--gold:#A07A2C;--gold-soft:#E7DABA;--green:#4A6B3A;--green-soft:#DAE2CC}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}
.app{background:var(--cream);min-height:100vh}
.display{font-family:Georgia,serif;letter-spacing:-0.02em;font-weight:600}
.tag{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft)}
.soft{color:var(--ink-soft)}.slate{color:var(--slate)}.rust{color:var(--rust)}.gold{color:var(--gold)}.green{color:var(--green)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;transition:all .2s ease}
.card-click{cursor:pointer}
.card-click:hover{border-color:var(--ink);box-shadow:0 6px 20px rgba(26,27,46,.06);transform:translateY(-1px)}
button{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.btn{font-weight:500;border-radius:2px;padding:12px 20px;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s ease;border:1px solid var(--ink)}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-primary:hover{background:var(--ink-2)}
.btn-rust{background:var(--rust);color:var(--cream);border-color:var(--rust)}
.btn-rust:hover{background:var(--rust-deep)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.btn-text{background:transparent;color:var(--ink-soft);border:none;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.btn-text:hover{color:var(--ink)}
.badge{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;display:inline-flex;align-items:center;gap:6px}
.badge-rust{background:var(--rust-soft);color:var(--rust-deep)}
.badge-gold{background:var(--gold-soft);color:var(--gold)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-ink{background:var(--ink);color:var(--cream)}
.badge-line{border:1px solid var(--line);color:var(--ink-soft)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--slate-soft);transition:all .5s ease;flex-shrink:0;display:inline-block}
.dot-sample{background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink-soft)}
.dot-scanning{animation:scanPulse 1.4s ease-in-out infinite}
.dot-scanning-sample{animation:scanPulse 1.4s ease-in-out infinite;box-shadow:inset 0 0 0 2px var(--ink-soft)}
.dot-anomaly{background:var(--rust)!important;box-shadow:0 0 0 4px var(--rust-soft),0 0 16px rgba(184,60,47,.5);transform:scale(1.5);animation:anomalyAppear .6s ease-out}
@keyframes scanPulse{0%,100%{background:var(--slate-soft)}50%{background:var(--gold-soft)}}
@keyframes anomalyAppear{0%{transform:scale(0);background:var(--gold)}60%{transform:scale(1.9)}100%{transform:scale(1.5)}}
.fadein{animation:fadeIn .5s ease forwards;opacity:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.statusline{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;color:var(--ink-soft)}
.statusline-active{color:var(--ink)}
.divider{height:1px;background:var(--line);width:100%}
.pulse::after{content:'▮';margin-left:4px;animation:blink 1s infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.ctrl-row:last-child{border-bottom:none}
.ctrl-row-missed{animation:sweep .8s ease}
@keyframes sweep{0%{background:var(--rust-soft)}100%{background:transparent}}
.pill{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.dot-grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:8px;max-width:760px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.stat-tile{padding:24px;background:var(--paper);transition:all .3s ease}
.detail-grid{display:grid;grid-template-columns:1fr 2fr;gap:40px}
.header-inner{max-width:1152px;margin:0 auto;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.main-inner{max-width:1152px;margin:0 auto;padding:48px 32px}
.footer-inner{max-width:1152px;margin:0 auto;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.status-action{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.flexgap{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ---- DATA ----
var TOTAL=847, SAMPLE=25, PERIOD='Q3 2025', DOTS=200;
var SAMPLE_IDX=[4,17,28,41,52,67,79,88,101,113,128,142,159,171,186];
var ANOM_IDX=[56,124,177];
var ANOMALIES=[
 {id:'A1',title:'Mogelijke opdrachtsplitsing',teaser:'Twee facturen, één leverancier, beide net onder de €50k-drempel.',score:92,ref:'F-2025-08-3478 + F-2025-08-3501',vendor:'Heuvels Bouw & Onderhoud B.V.',amounts:['€48.500','€49.200'],total:'€97.700',cat:'Terreinonderhoud',loc:'Kazerne Oirschot',date:'12-08-2025 en 16-08-2025',
  reasoning:['Twee facturen van dezelfde leverancier voor dezelfde dienst binnen 4 dagen.','Beide bedragen tussen €48k en €50k — net onder de drempel voor verplichte tweede handtekening.','Patroon herhaald 3× eerder dit jaar (apr/jun/jul) bij dezelfde leverancier.','Gecombineerd bedrag (€97.700) had aanbestedingsplicht moeten triggeren.'],
  missed:[{code:'IC-04',label:'Tweede handtekening boven €50.000',note:'Beide facturen onder drempel — controle gaf geen signaal.'},{code:'IC-12',label:'Aanbestedingsplicht-check',note:'Per factuur beoordeeld, niet op opdrachtniveau.'}],
  follow:['Hoe rechtvaardigt de inkoper de gespreide opdrachtverlening?','Welke andere kazernes zijn dit jaar door deze leverancier onderhouden?','Is er een raamovereenkomst die dit werk had moeten dekken?']},
 {id:'A2',title:'Grote uitgave, leverancier zonder voorgeschiedenis',teaser:'Nieuwe BV. Woonadres als vestiging. €127k voor "strategisch advies".',score:88,ref:'F-2025-09-4127',vendor:'NovaTech Solutions B.V.',amounts:['€127.000'],total:'€127.000',cat:'IT-advies, strategisch',loc:'Bestuursstaf',date:'07-09-2025',
  reasoning:['Leverancier ingeschreven 14-03-2025 — 5,8 maanden vóór eerste factuur.','KvK-vestigingsadres komt overeen met een woonadres in een wijk zonder zakelijke vestigingen.','Geen voorafgaande inkooporders, geen traceerbaar offerteproces.','Omschrijving zonder concrete deliverables of urenstaten in bijlage.'],
  missed:[{code:'IC-07',label:'Leveranciersvalidatie via KvK',note:'KvK-check uitgevoerd — oprichtingsdatum niet gewogen.'},{code:'IC-15',label:'Onderbouwing inkoopopdracht',note:'Tekstuele onderbouwing aanwezig, niet inhoudelijk getoetst.'}],
  follow:['Wie is intern opdrachtgever en hoe is deze leverancier geselecteerd?','Welke concrete deliverables zijn opgeleverd en geaccepteerd?','Is dezelfde dienst beschikbaar binnen een lopend raamcontract?']},
 {id:'A3',title:'Goedkeuring in 3 minuten op zaterdagavond',teaser:'Spoed-aanvraag om 22:44, akkoord om 22:47. €89,4k.',score:74,ref:'F-2025-07-2891',vendor:'MariSupply Nederland B.V.',amounts:['€89.400'],total:'€89.400',cat:'Spoedbestelling onderhoudsmateriaal',loc:'Marinekazerne Den Helder',date:'19-07-2025 — ingediend 22:44, goedgekeurd 22:47',
  reasoning:['Goedkeuringstijd 3 minuten — historisch gemiddelde voor deze categorie: 2,4 werkdagen.','Indiening én goedkeuring buiten kantoortijden (zaterdagavond).','Goedkeurder handelde dit kwartaal 17 facturen van deze leverancier in <10 minuten af.','Categorie "spoed" gebruikt bij 41% van facturen van deze leverancier (sectorgemiddelde: 6%).'],
  missed:[{code:'IC-09',label:'Functiescheiding aanvrager / goedkeurder',note:'Formeel andere personen — feitelijk patroon van rubber-stamping.'},{code:'IC-22',label:'Spoedprocedure-toets',note:'Motivatie aanwezig in aanvraag, niet inhoudelijk getoetst.'}],
  follow:['Welke fysieke spoed rechtvaardigde indiening om 22:44 op zaterdag?','Wat is de werkrelatie tussen aanvrager, goedkeurder en deze leverancier?','Is er een vergelijkbaar patroon rond andere weekenden?']}
];
var CONTROLS=[
 {code:'IC-04',label:'Tweede handtekening boven €50.000',active:23},
 {code:'IC-07',label:'Leveranciersvalidatie via KvK',active:847},
 {code:'IC-09',label:'Functiescheiding aanvrager/goedkeurder',active:847},
 {code:'IC-12',label:'Aanbestedingsplicht-check',active:38},
 {code:'IC-15',label:'Onderbouwing inkoopopdracht',active:847},
 {code:'IC-22',label:'Spoedprocedure-toets',active:51}
];
var SCAN_MSGS=['AI toetst werking van 6 controles op 847 transacties…','Vergelijkt met historische patronen…','Identificeert gevallen die de controles níet afdekken…','Onderbouwt elk signaal in natuurlijke taal…'];

// ---- STATE ----
var state={phase:'idle',selected:null,decisions:{},followUps:{},scanIdx:0};
var scanTimer=null;

function nl(n){return n.toLocaleString('nl-NL');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---- RENDER ----
function render(){
  var app=document.getElementById('app');
  app.innerHTML = header() + '<main><div class="main-inner">' + (state.selected?detail():overview()) + '</div></main>' + footer();
  bind();
}

function header(){
  return '<header style="border-bottom:1px solid var(--line)"><div class="header-inner">'
   +'<div class="row" style="gap:16px"><div class="display" style="font-size:22px">AuditLens</div>'
   +'<div class="tag">Prototype · Defensie · Controles op inkoopproces</div></div>'
   +'<div class="row" style="gap:12px"><span class="badge badge-line">DEMO · synthetische data</span>'
   +(state.phase!=='idle'?'<button class="btn-text" data-act="reset">↺ opnieuw</button>':'')
   +'</div></div></header>';
}
function footer(){
  return '<footer style="border-top:1px solid var(--line);margin-top:48px"><div class="footer-inner tag">'
   +'<span>IIA Congres 2026 · Pride &amp; Prejudice</span><span>Van vinken naar vonken</span></div></footer>';
}

function dotGrid(){
  var showAnom=state.phase==='revealed_anomalies', dec=Object.keys(state.decisions);
  var out='<div class="dot-grid">';
  for(var i=0;i<DOTS;i++){
    var isS=SAMPLE_IDX.indexOf(i)>=0, ai=ANOM_IDX.indexOf(i), isA=ai>=0;
    var aid=isA?ANOMALIES[ai].id:null, done=aid&&dec.indexOf(aid)>=0;
    var c='dot';
    if((state.phase==='sample'||state.phase==='revealed_controls')&&isS)c+=' dot-sample';
    if(state.phase==='scanning')c+=isS?' dot-scanning-sample':' dot-scanning';
    if(showAnom){if(isA&&!done)c+=' dot-anomaly';else if(isS)c+=' dot-sample';}
    out+='<span class="'+c+'"></span>';
  }
  return out+'</div>';
}

function statTile(label,val,sub,o){o=o||{};
  var bg=o.hl?(o.rust?'var(--rust-soft)':'var(--cream-soft)'):'var(--paper)';
  return '<div class="stat-tile" style="background:'+bg+';opacity:'+(o.dim?0.6:1)+'">'
   +'<div class="tag" style="margin-bottom:8px">'+label+'</div>'
   +'<div class="display" style="font-size:28px;line-height:1;margin-bottom:4px;color:'+(o.rust?'var(--rust)':'var(--ink)')+'">'+val+'</div>'
   +'<div class="mono soft" style="font-size:11px">'+sub+'</div></div>';
}

function severity(score){
  return '<div class="row" style="gap:12px"><span class="mono soft" style="font-size:10px">RISICOSCORE</span>'
   +'<div style="flex:1;height:4px;max-width:120px;background:var(--slate-soft)"><div style="height:100%;width:'+score+'%;background:var(--rust)"></div></div>'
   +'<span class="mono" style="font-size:13px;color:var(--rust-deep)">'+score+'</span></div>';
}

function controlsBlock(){
  var isC=state.phase==='revealed_controls', isA=state.phase==='revealed_anomalies';
  var out='<div class="card" style="padding:32px;margin-bottom:48px;background:'+(isC?'var(--cream-soft)':'var(--paper)')+'">';
  out+='<div class="row" style="align-items:flex-start;gap:16px;margin-bottom:24px">';
  out+='<span style="font-size:20px;color:'+(isC?'var(--green)':'var(--gold)')+';margin-top:2px">'+(isC?'✓':'⚠')+'</span><div>';
  out+='<div class="tag" style="margin-bottom:8px">'+(isC?'Werking interne controles Q3 2025':'Diezelfde controles, opnieuw bekeken')+'</div>';
  out+='<div class="display" style="font-size:22px;margin-bottom:8px">'+(isC?'Zes controles. Een kwartaal lang actief. Nul bevindingen.':'Zes controles. Geen één van deze drie gevallen gesignaleerd.')+'</div>';
  out+='<p class="soft" style="margin:0;max-width:680px">'+(isC?'Het controleraamwerk doet wat het moet doen — formeel. Auditrapport zou hier kunnen stoppen.':'De controles werkten naar behoren — formeel niets misgegaan. Maar geen ervan zou de drie hierboven hebben opgemerkt.')+'</p>';
  out+='</div></div><div class="divider" style="margin-bottom:8px"></div>';
  CONTROLS.forEach(function(c,idx){
    out+='<div class="ctrl-row'+(isA?' ctrl-row-missed':'')+'" style="animation-delay:'+(idx*80)+'ms">';
    out+='<div class="row" style="gap:16px"><span class="mono soft" style="font-size:12px;width:48px">'+c.code+'</span><span style="font-size:14px">'+c.label+'</span></div>';
    out+='<div class="row" style="gap:24px"><span class="mono soft" style="font-size:12px">'+nl(c.active)+'× actief</span>';
    out+=isC?'<span class="pill" style="background:var(--green-soft);color:var(--green)">✓ in orde</span>':'<span class="pill" style="background:var(--rust-soft);color:var(--rust-deep)">✕ niet onderkend</span>';
    out+='</div></div>';
  });
  return out+'</div>';
}

function anomalyCard(a,idx){
  var lbl={accepted:'Bevinding geaccepteerd',rejected:'Verworpen',investigating:'Onderzoek loopt'}[state.decisions[a.id]];
  var out='<div class="card card-click fadein" data-sel="'+a.id+'" style="padding:24px;animation-delay:'+(idx*0.15)+'s">';
  out+='<div class="row" style="align-items:flex-start;gap:24px">';
  out+='<span class="mono soft" style="font-size:11px;padding-top:2px;width:24px">'+a.id+'</span><div style="flex:1">';
  out+='<div class="row between" style="align-items:flex-start;gap:24px;margin-bottom:8px"><div class="display" style="font-size:18px">'+a.title+'</div>'+(lbl?'<span class="badge badge-ink">'+lbl+'</span>':'')+'</div>';
  out+='<p class="soft" style="margin:0 0 16px;font-size:15px">'+a.teaser+'</p>';
  out+='<div class="row between" style="gap:24px"><div class="row" style="gap:20px;font-size:14px;color:var(--ink-soft)"><span>🏢 '+a.vendor+'</span><span class="mono">'+a.total+'</span></div>'+severity(a.score)+'</div>';
  out+='</div><span class="soft" style="font-size:18px;padding-top:2px">›</span></div></div>';
  return out;
}

function overview(){
  var p=state.phase, isC=p==='revealed_controls', isA=p==='revealed_anomalies', isR=isC||isA;
  var out='<div>';
  // HERO
  out+='<div style="margin-bottom:40px"><div class="tag" style="margin-bottom:12px">Inkoopproces · '+PERIOD+'</div>';
  if(p==='idle') out+='<div class="display" style="font-size:42px;line-height:1.15;margin-bottom:12px;max-width:880px">6 interne controles. 847 transacties.<br>Werken die controles voor de risico\'s die u denkt af te dekken?</div><p class="soft" style="font-size:17px;max-width:720px;margin:0">Data-analyse op volledige populaties doet u misschien al. Wat AI hier toevoegt: uitleg in natuurlijke taal en suggesties voor vervolgvragen — voor u als derde lijn.</p>';
  if(p==='sample') out+='<div class="display" style="font-size:42px;line-height:1.15;margin-bottom:12px">25 willekeurige facturen. <span class="soft">0 bevindingen.</span></div><p class="soft" style="font-size:17px;margin:0">De steekproef werkt zoals altijd. Niets opmerkelijks. Laten we nu de andere kant op kijken.</p>';
  if(p==='scanning') out+='<div class="display" style="font-size:42px;line-height:1.15;margin-bottom:12px">AuditLens toetst de werking…</div><p class="soft" style="font-size:17px;margin:0">Niet of de controles bestaan — of ze afdekken wat ze moeten afdekken.</p>';
  if(isC) out+='<div class="display" style="font-size:42px;line-height:1.15;margin-bottom:12px;max-width:880px">Zes controles. 847 transacties.<br><span class="green">Nul bevindingen.</span></div><p class="soft" style="font-size:17px;max-width:720px;margin:0">Op papier draait het systeem perfect. Maar de vraag is niet of de controles vuren — de vraag is of ze de juiste dingen zien.</p>';
  if(isA) out+='<div class="display" style="font-size:42px;line-height:1.15;margin-bottom:12px;max-width:880px">Drie gevallen. <span class="rust">Geen van deze controles</span> zou ze hebben opgemerkt.</div><p class="soft" style="font-size:17px;max-width:720px;margin:0">AuditLens analyseerde de volledige populatie in <span class="mono">2,7 sec</span>. Klik op een geval om de redenering te zien.</p>';
  out+='</div>';
  // STATS
  out+='<div class="stat-grid" style="margin-bottom:48px">';
  out+=statTile('Populatie',nl(TOTAL),'transacties',{});
  out+=statTile('Controles','6','raamwerk Q3 2025',{hl:isC});
  out+=statTile('Steekproef',String(SAMPLE),'3% · willekeurig',{dim:p==='idle',hl:p==='sample'});
  out+=statTile('AI-bevindingen',isA?'3':(isC?'?':'—'),isA?'binnen 2,7 sec':(isC?'nog te onthullen':'nog niet gedraaid'),{hl:isA,rust:isA});
  out+='</div>';
  // DOTS
  out+='<div class="card" style="padding:40px;margin-bottom:32px;display:flex;flex-direction:column;align-items:center">'+dotGrid();
  out+='<div class="row between" style="margin-top:32px;width:100%;max-width:760px"><div class="row tag" style="gap:24px">';
  out+='<span class="row" style="gap:8px"><span class="dot" style="width:10px;height:10px"></span> transactie</span>';
  out+='<span class="row" style="gap:8px"><span class="dot dot-sample" style="width:10px;height:10px"></span> in steekproef</span>';
  if(isA) out+='<span class="row" style="gap:8px"><span class="dot" style="width:10px;height:10px;background:var(--rust);box-shadow:0 0 0 2px var(--rust-soft)"></span> niet afgedekt</span>';
  out+='</div><span class="tag slate">1 punt ≈ 4 transacties</span></div></div>';
  // STATUS BAR
  out+='<div class="card" style="padding:24px;margin-bottom:48px">';
  if(p==='idle') out+='<div class="status-action"><div class="statusline">Hoe wilt u beginnen — de gebruikelijke steekproef, of AI op de werking van het hele raamwerk?</div><div class="flexgap"><button class="btn btn-ghost" data-act="sample">Toon traditionele steekproef</button><button class="btn btn-primary" data-act="scan">✦ Toets controles met AI</button></div></div>';
  if(p==='sample') out+='<div class="status-action"><div><div class="tag" style="margin-bottom:4px">Steekproef getrokken</div><div style="font-size:16px">Inhoudelijke toets levert <span class="mono">0 bevindingen</span> op. <span class="soft">Geen rode vlaggen.</span></div></div><button class="btn btn-primary" data-act="scan">✦ Toets nu de werking van de controles →</button></div>';
  if(p==='scanning') out+='<div class="row" style="gap:16px"><span class="mono" style="font-size:10px;padding:4px 8px;background:var(--gold-soft);color:var(--gold)">AI</span><span class="statusline statusline-active pulse">'+SCAN_MSGS[state.scanIdx]+'</span></div>';
  if(isC) out+='<div class="status-action"><div class="row" style="gap:12px"><span style="color:var(--green)">✓</span><span class="mono" style="font-size:12px">analyse voltooid · 2,7 sec · 6 controles getoetst · 0 formele bevindingen</span></div><button class="btn btn-rust" data-act="reveal">⊙ Toon wat deze controles níet hebben gezien →</button></div>';
  if(isA) out+='<div class="status-action"><div class="row" style="gap:12px"><span style="color:var(--rust)">⚠</span><span class="mono" style="font-size:12px">3 gevallen onthuld · niet afgedekt door bestaande controles</span></div><div class="soft" style="font-size:14px">Handmatig vergelijkbaar werk: ± <span class="mono">14 werkdagen</span></div></div>';
  out+='</div>';
  if(isR) out+=controlsBlock();
  if(isA){
    out+='<div class="row between" style="align-items:baseline;margin-bottom:24px"><div class="display" style="font-size:22px">De drie gevallen</div><div class="tag">AI signaleert · u beoordeelt</div></div>';
    out+='<div style="display:flex;flex-direction:column;gap:16px;margin-bottom:48px">';
    ANOMALIES.forEach(function(a,i){out+=anomalyCard(a,i);});
    out+='</div>';
  }
  return out+'</div>';
}

function detail(){
  var a=ANOMALIES.filter(function(x){return x.id===state.selected;})[0];
  var dec=state.decisions[a.id], fu=state.followUps[a.id];
  var out='<div><button class="btn-text" data-act="back" style="margin-bottom:32px">‹ terug naar overzicht</button>';
  out+='<div style="margin-bottom:40px"><div class="row" style="gap:12px;margin-bottom:12px"><span class="tag">'+a.id+'</span><span class="badge badge-rust">⚠ Niet afgedekt door huidige controles</span></div>';
  out+='<div class="display" style="font-size:36px;line-height:1.2;margin-bottom:12px;max-width:780px">'+a.title+'</div><p class="soft" style="font-size:17px;margin:0">'+a.teaser+'</p></div>';
  out+='<div class="detail-grid" style="margin-bottom:48px"><div><div class="tag" style="margin-bottom:16px">Transactiegegevens</div>';
  var fields=[['Leverancier',a.vendor,0],['Bedrag',a.total,1],['Splitsing',a.amounts.length>1?a.amounts.join(' + '):'—',1],['Categorie',a.cat,0],['Locatie',a.loc,0],['Datum',a.date,1],['Referentie',a.ref,1]];
  fields.forEach(function(f){out+='<div style="margin-bottom:16px"><div class="tag" style="margin-bottom:4px">'+f[0]+'</div><div class="'+(f[2]?'mono':'')+'" style="font-size:14px">'+f[1]+'</div></div>';});
  out+='</div><div>';
  out+='<div class="row" style="gap:12px;margin-bottom:16px"><span class="badge badge-gold">✦ AI-redenering</span><span class="mono soft" style="font-size:11px">risicoscore '+a.score+' / 100</span></div>';
  out+='<ol style="list-style:none;padding:0;margin:0 0 32px">';
  a.reasoning.forEach(function(r,i){out+='<li class="row" style="align-items:flex-start;gap:16px;margin-bottom:12px"><span class="mono soft" style="font-size:11px;padding-top:2px;width:20px;flex-shrink:0">'+(i+1<10?'0':'')+(i+1)+'</span><span style="line-height:1.6">'+r+'</span></li>';});
  out+='</ol>';
  out+='<div class="card" style="padding:24px;margin-bottom:24px;background:var(--cream-soft)"><div class="row" style="align-items:flex-start;gap:12px;margin-bottom:16px"><span style="color:var(--gold);font-size:16px;flex-shrink:0">⚠</span><div><div class="tag" style="margin-bottom:4px">Welke controles hadden dit moeten zien?</div><div style="font-size:14px">Bestaande controles gaven geen signaal — niet omdat ze faalden, maar omdat ze niet zo zijn ontworpen.</div></div></div>';
  a.missed.forEach(function(c){out+='<div class="row" style="align-items:flex-start;gap:16px;margin-bottom:12px;padding-left:28px"><span class="mono soft" style="font-size:12px;width:48px;flex-shrink:0">'+c.code+'</span><div style="font-size:13px"><div style="font-weight:600">'+c.label+'</div><div class="soft" style="margin-top:2px">'+c.note+'</div></div></div>';});
  out+='</div>';
  if(!fu) out+='<button class="btn btn-ghost" data-act="follow">? Vraag door · genereer onderzoeksvragen</button>';
  else{out+='<div class="fadein"><div class="tag" style="margin-bottom:12px">✦ Voorgestelde onderzoeksvragen</div>';
    a.follow.forEach(function(q){out+='<div class="row" style="align-items:flex-start;gap:12px;margin-bottom:8px;font-size:14px"><span class="mono soft">→</span><span>'+q+'</span></div>';});
    out+='<div class="soft" style="font-size:12px;font-style:italic;margin-top:12px">U beoordeelt. De AI vraagt niet — die suggereert.</div></div>';}
  out+='</div></div>';
  out+='<div class="card" style="padding:24px"><div class="status-action"><div><div class="tag" style="margin-bottom:4px">Uw oordeel als derde lijn</div><div style="font-size:15px">AI signaleert. Het management herstelt. <span class="soft">U beoordeelt of het stelsel werkt.</span></div></div><div class="flexgap">';
  out+='<button class="btn '+(dec==='rejected'?'btn-primary':'btn-ghost')+'" data-dec="rejected">✕ Verwerpen</button>';
  out+='<button class="btn '+(dec==='investigating'?'btn-primary':'btn-ghost')+'" data-dec="investigating">⊙ Onderzoek openen</button>';
  out+='<button class="btn '+(dec==='accepted'?'btn-primary':'btn-ghost')+'" data-dec="accepted">✓ Bevinding accepteren</button>';
  out+='</div></div></div></div>';
  return out;
}

// ---- EVENTS ----
function startScan(){
  state.scanIdx=0; render();
  var i=0;
  scanTimer=setInterval(function(){
    i++;
    if(i>=SCAN_MSGS.length){clearInterval(scanTimer);setTimeout(function(){state.phase='revealed_controls';render();},600);}
    else{state.scanIdx=i;render();}
  },700);
}
function bind(){
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.onclick=function(){
      var a=el.getAttribute('data-act');
      if(a==='sample'){state.phase='sample';render();}
      else if(a==='scan'){state.phase='scanning';startScan();}
      else if(a==='reveal'){state.phase='revealed_anomalies';render();}
      else if(a==='reset'){if(scanTimer)clearInterval(scanTimer);state={phase:'idle',selected:null,decisions:{},followUps:{},scanIdx:0};render();}
      else if(a==='back'){state.selected=null;render();}
      else if(a==='follow'){state.followUps[state.selected]=true;render();}
    };
  });
  document.querySelectorAll('[data-sel]').forEach(function(el){
    el.onclick=function(){state.selected=el.getAttribute('data-sel');render();};
  });
  document.querySelectorAll('[data-dec]').forEach(function(el){
    el.onclick=function(){state.decisions[state.selected]=el.getAttribute('data-dec');render();};
  });
}

render();
</script>

</html>
